<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>随机决定器</title>
    <style>
      :root {
        --bg1: #6a11cb;
        --bg2: #2575fc;
        --card: rgba(255, 255, 255, 0.14);
        --line: rgba(255, 255, 255, 0.28);
        --text: #fff;
        --muted: rgba(255, 255, 255, 0.72);
        --accent: #ffd54a;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei",
          "Helvetica Neue", Arial, sans-serif;
        color: var(--text);
        background: linear-gradient(160deg, var(--bg1), var(--bg2));
        background-attachment: fixed;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
      }
      .wrap {
        width: 100%;
        max-width: 560px;
        margin: auto;
        padding: 24px 0 40px;
      }
      h1 {
        font-size: 1.7rem;
        text-align: center;
        letter-spacing: 1px;
        margin-bottom: 4px;
      }
      .sub {
        text-align: center;
        color: var(--muted);
        font-size: 0.9rem;
        margin-bottom: 22px;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--line);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border-radius: 20px;
        padding: 16px;
        box-shadow: 0 12px 34px rgba(0, 0, 0, 0.22);
      }
      label {
        font-size: 0.85rem;
        color: var(--muted);
        display: block;
        margin-bottom: 8px;
      }
      textarea {
        width: 100%;
        min-height: 150px;
        max-height: 38vh;
        resize: vertical;
        border: none;
        border-radius: 14px;
        padding: 14px;
        font-size: 1rem;
        line-height: 1.7;
        font-family: inherit;
        color: #1a1a2e;
        background: rgba(255, 255, 255, 0.96);
        outline: none;
      }
      textarea:focus {
        box-shadow: 0 0 0 3px rgba(255, 213, 74, 0.55);
      }

      .btns {
        display: flex;
        gap: 12px;
        margin-top: 16px;
        flex-wrap: wrap;
      }
      button {
        flex: 1 1 auto;
        min-height: 52px;
        font-size: 1.05rem;
        font-weight: 700;
        font-family: inherit;
        border: none;
        border-radius: 14px;
        cursor: pointer;
        transition:
          transform 0.12s ease,
          box-shadow 0.2s ease,
          opacity 0.2s;
        user-select: none;
      }
      button:active {
        transform: scale(0.96);
      }
      .primary {
        background: var(--accent);
        color: #4a3500;
      }
      .primary:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .ghost {
        background: rgba(255, 255, 255, 0.16);
        color: #fff;
        border: 1px solid var(--line);
      }
      .ghost:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      /* 结果区 */
      .stage {
        margin-top: 22px;
        min-height: 120px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px 16px;
        border-radius: 20px;
        background: rgba(0, 0, 0, 0.16);
        border: 1px dashed var(--line);
        overflow: hidden;
      }
      .hint {
        color: var(--muted);
        font-size: 0.95rem;
      }
      .result {
        font-size: clamp(1.6rem, 9vw, 3.4rem);
        font-weight: 800;
        line-height: 1.25;
        word-break: break-all;
        display: none;
      }
      .result.show {
        display: block;
      }

      /* 滚动抽奖动画 */
      @keyframes roll {
        0% {
          transform: translateY(-60%) scale(1.05);
          opacity: 0.25;
        }
        100% {
          transform: translateY(0) scale(1);
          opacity: 1;
        }
      }
      .rolling .result {
        display: block;
        animation: roll 0.12s linear infinite;
        color: var(--accent);
      }
      /* 命中定格 */
      @keyframes pop {
        0% {
          transform: scale(0.6) rotate(-4deg);
          opacity: 0;
        }
        55% {
          transform: scale(1.18) rotate(2deg);
        }
        100% {
          transform: scale(1) rotate(0);
          opacity: 1;
        }
      }
      .done .result {
        display: block;
        animation: pop 0.5s cubic-bezier(0.22, 1.4, 0.45, 1) forwards;
        color: var(--accent);
        text-shadow: 0 4px 20px rgba(255, 213, 74, 0.45);
      }
      @keyframes pulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(255, 213, 74, 0.5);
        }
        50% {
          box-shadow: 0 0 0 16px rgba(255, 213, 74, 0);
        }
      }
      .done.stage {
        animation: pulse 1.4s ease 1;
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: calc(env(safe-area-inset-bottom) + 24px);
        transform: translate(-50%, 20px);
        background: rgba(0, 0, 0, 0.82);
        color: #fff;
        padding: 10px 20px;
        border-radius: 30px;
        font-size: 0.92rem;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.25s,
          transform 0.25s;
        z-index: 99;
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      footer {
        text-align: center;
        color: var(--muted);
        font-size: 0.78rem;
        margin-top: 26px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>🎲 随机决定器</h1>
      <p class="sub">拿不定主意？交给运气吧</p>

      <div class="card">
        <label for="list">输入选项，每行一个：</label>
        <textarea
          id="list"
          spellcheck="false"
          placeholder="吃什么&#10;火锅&#10;烧烤&#10;寿司&#10;随便你选"
        >
火锅
烧烤
寿司
麻辣烫
轻食沙拉
奶茶配炸鸡</textarea
        >

        <div class="btns">
          <button class="primary" id="start">开始决定</button>
          <button class="ghost" id="copy" disabled>复制结果</button>
        </div>
      </div>

      <div class="stage" id="stage">
        <span class="hint" id="hint">结果会出现在这里 ✨</span>
        <div class="result" id="result"></div>
      </div>

      <footer>纯原生实现 · 手机电脑都能用</footer>
    </div>

    <div class="toast" id="toast">已复制到剪贴板 📋</div>

    <script>
      (function () {
        var listEl = document.getElementById("list");
        var startBtn = document.getElementById("start");
        var copyBtn = document.getElementById("copy");
        var stage = document.getElementById("stage");
        var resultEl = document.getElementById("result");
        var hint = document.getElementById("hint");
        var toast = document.getElementById("toast");

        var timer = null;
        var picked = "";
        var running = false;

        // 解析非空选项
        function getOptions() {
          return listEl.value
            .split(/\r?\n/)
            .map(function (s) {
              return s.trim();
            })
            .filter(function (s) {
              return s !== "";
            });
        }

        function showToast(msg) {
          toast.textContent = msg;
          toast.classList.add("show");
          clearTimeout(toast._t);
          toast._t = setTimeout(function () {
            toast.classList.remove("show");
          }, 1600);
        }

        // 抽奖滚动：每 90ms 换一个候选
        function roll() {
          var opts = getOptions();
          if (opts.length === 0) return;
          resultEl.textContent = opts[Math.floor(Math.random() * opts.length)];
        }

        function start() {
          var opts = getOptions();
          if (opts.length === 0) {
            showToast("请先输入至少一个选项～");
            listEl.focus();
            return;
          }

          running = true;
          startBtn.disabled = true;
          copyBtn.disabled = true;
          picked = "";

          stage.className = "stage rolling";
          hint.style.display = "none";
          resultEl.style.color = "";

          var cycles = 0;
          var maxCycles = 22 + Math.floor(Math.random() * 12); // 滚动时长随机
          timer = setInterval(function () {
            roll();
            cycles++;
            if (cycles >= maxCycles) {
              clearInterval(timer);
              timer = null;
              finalize(opts);
            }
          }, 90);
        }

        function finalize(opts) {
          picked = opts[Math.floor(Math.random() * opts.length)];
          resultEl.textContent = picked;

          stage.className = "stage done";
          copyBtn.disabled = false;
          running = false;
          startBtn.disabled = false;
          startBtn.textContent = "再抽一次";
        }

        function copy() {
          if (!picked) {
            return;
          }
          var text = "🎲 随机决定结果：" + picked;

          // 优先用 Clipboard API，失败则降级 execCommand
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(
              function () {
                showToast("已复制：" + picked);
              },
              function () {
                fallbackCopy(text);
              },
            );
          } else {
            fallbackCopy(text);
          }
        }

        function fallbackCopy(text) {
          var ta = document.createElement("textarea");
          ta.value = text;
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          ta.style.left = "-9999px";
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          try {
            var ok = document.execCommand("copy");
            showToast(
              ok ? "已复制：" + picked : "复制失败，请手动长按结果复制",
            );
          } catch (e) {
            showToast("复制失败，请手动长按结果复制");
          }
          document.body.removeChild(ta);
        }

        // 防止动画期间重复点击
        startBtn.addEventListener("click", function () {
          if (running) return;
          start();
        });
        copyBtn.addEventListener("click", copy);

        // 输入内容变化时，若还没开始则清空旧结果提示
        listEl.addEventListener("input", function () {
          if (running) return;
          if (copyBtn.disabled && picked) {
            // 用户改了选项，旧结果失效
            picked = "";
            copyBtn.disabled = true;
            stage.className = "stage";
            resultEl.className = "result";
            resultEl.textContent = "";
            hint.style.display = "";
            hint.textContent = "选项已更新，点「开始决定」再抽一次 ✨";
            startBtn.textContent = "开始决定";
          }
        });
      })();
    </script>
  </body>
</html>
